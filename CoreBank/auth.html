<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreBank - Giriş ve Kayıt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f4f7f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
    }
    .nav-pills .nav-link {
      color: #6c757d;
      font-weight: 600;
    }
    .nav-pills .nav-link.active {
      background-color: #0d6efd;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container p-3">
    <div class="card auth-card border-0 shadow-sm mx-auto p-4">
      
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle p-3 mb-2">
          <i class="bi bi-bank2 fs-3"></i>
        </div>
        <h4 class="fw-bold mb-1">CoreBank</h4>
        <p class="text-muted small mb-0">Bireysel İnternet Bankacılığı</p>
      </div>

      <div id="alertBox" class="alert d-none py-2 small" role="alert"></div>

      <ul class="nav nav-pills nav-fill mb-4 bg-light p-1 rounded-3" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active py-2" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">Giriş Yap</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link py-2" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">Kayıt Ol</button>
        </li>
      </ul>

      <div class="tab-content" id="authTabsContent">
        
        <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">E-posta Adresi</label>
              <input type="email" class="form-control" id="loginEmail" placeholder="ornek@mail.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Şifre</label>
              <input type="password" class="form-control" id="loginPassword" placeholder="Şifreniz" required>
            </div>
            <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-2 fw-semibold mt-2">Giriş Yap</button>
          </form>
        </div>

        <div class="tab-pane fade" id="register-pane" role="tabpanel">
          <form id="registerForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Ad Soyad</label>
              <input type="text" class="form-control" id="registerFullName" placeholder="Adınız Soyadınız" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">T.C. Kimlik No</label>
              <input type="text" class="form-control" id="registerIdentityNumber" placeholder="11 Haneli Kimlik Numaranız" inputmode="numeric" pattern="[0-9]{11}" oninput="this.value = this.value.replace(/[^0-9]/g, '')" maxlength="11" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">E-posta</label>
              <input type="email" class="form-control" id="registerEmail" placeholder="ornek@mail.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Şifre</label>
              <input type="password" class="form-control" id="registerPassword" placeholder="En az 6 karakter" minlength="6" required>
            </div>
            <button type="submit" id="btnRegister" class="btn btn-success w-100 py-2 fw-semibold mt-2">Hesap Oluştur</button>
          </form>
        </div>

      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_BASE_URL = 'http://localhost:5296/api';

    const alertBox = document.getElementById('alertBox');

    function showAlert(message, type = 'danger') {
      alertBox.className = `alert alert-${type} py-2 small mb-3`;
      alertBox.textContent = message;
      alertBox.classList.remove('d-none');
    }

    function hideAlert() {
      alertBox.classList.add('d-none');
    }

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      hideAlert();

      const btn = document.getElementById('btnRegister');
      btn.disabled = true;
      btn.textContent = 'Kaydediliyor...';

      const payload = {
        adSoyad: document.getElementById('registerFullName').value.trim(),
        tc: document.getElementById('registerIdentityNumber').value.trim(),
        eposta: document.getElementById('registerEmail').value.trim(),
        sifre: document.getElementById('registerPassword').value
      };

      try {
        const res = await fetch(`${API_BASE_URL}/Auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || 'Kayıt başarısız oldu.');
        }

        showAlert('Hesabınız başarıyla oluşturuldu! Şimdi giriş yapabilirsiniz.', 'success');
        document.getElementById('registerForm').reset();

        const loginTab = new bootstrap.Tab(document.querySelector('#login-tab'));
        loginTab.show();
        document.getElementById('loginEmail').value = payload.eposta;

      } catch (err) {
        showAlert(err.message, 'danger');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Hesap Oluştur';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      hideAlert();

      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.textContent = 'Giriş yapılıyor...';

      const payload = {
        eposta: document.getElementById('loginEmail').value.trim(),
        sifre: document.getElementById('loginPassword').value
      };

      try {
        const res = await fetch(`${API_BASE_URL}/Auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || 'Giriş başarısız oldu.');
        }

        localStorage.setItem('corebank_token', data.token);
        localStorage.setItem('corebank_user', JSON.stringify({
          adSoyad: data.adSoyad,
          iban: data.iban
        }));

        window.location.href = 'index.html';

      } catch (err) {
        showAlert(err.message, 'danger');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Giriş Yap';
      }
    });
  </script>
</body>
</html>
