<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreBank - Bireysel Bankacılık</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background-color: #f4f7f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .bank-card { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; border-radius: 16px; min-height: 160px; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-bank2 me-2"></i>CoreBank</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light small"><i class="bi bi-person-circle me-1"></i> <span id="userName">--</span></span>
        <a href="auth.html" class="btn btn-sm btn-outline-light py-1 px-3"><i class="bi bi-box-arrow-right me-1"></i>Çıkış</a>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row g-4">
      
      <div class="col-lg-5">

        <div class="card border-0 shadow-sm p-3 rounded-4 mb-3">
          <label class="form-label small fw-semibold text-muted mb-2">Görüntülenen Hesap</label>
          <select class="form-select rounded-3" id="accountSelect">
            <option value="" disabled selected>Hesap yükleniyor...</option>
          </select>
        </div>
        
        <div class="card bank-card p-4 shadow-sm border-0 mb-4" id="mainCard">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-white-50" id="cardAccountTitle">--</span>
            <i class="bi bi-credit-card-2-front fs-4"></i>
          </div>
          <h2 class="fw-bold mb-2" id="cardBalance">--</h2>
          <p class="mb-0 text-white-50 small font-monospace" id="cardIban">--</p>
        </div>

        <div class="card border-0 shadow-sm p-4 rounded-4">
          <h5 class="fw-bold mb-3"><i class="bi bi-send me-2 text-primary"></i>Para Transferi</h5>
          <form id="transferForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Alıcı IBAN</label>
              <input type="text" class="form-control text-uppercase" id="targetIban" placeholder="TR0000..." maxlength="26" pattern="TR[0-9]{24}" title="TR ile başlayan 26 haneli IBAN girin" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Tutar (<span id="transferCurrencySymbol">-</span>)</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="transferAmount" placeholder="0.00" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Açıklama</label>
              <input type="text" class="form-control" id="transferDesc" placeholder="Açıklama giriniz" maxlength="100">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">İşlemi Onayla</button>
          </form>
          <div id="transferAlert" class="mt-3 d-none alert py-2 small"></div>
        </div>

      </div>

      <div class="col-lg-7">
        <div class="card border-0 shadow-sm p-4 rounded-4 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="bi bi-clock-history me-2 text-primary"></i>Hesap Hareketleri</h5>
            <span class="badge bg-secondary-subtle text-secondary px-3 py-2 rounded-pill" id="tableFilterLabel">--</span>
          </div>
          
          <div class="table-responsive">
            <table class="table align-middle table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th class="small">Tarih</th>
                  <th class="small">Açıklama</th>
                  <th class="small text-end">Tutar</th>
                </tr>
              </thead>
              <tbody id="transactionList">
                <tr>
                  <td colspan="3" class="text-center text-muted py-4">İşlem geçmişi bulunamadı.</td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
