<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreBank - Giriş ve Kayıt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f4f7f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
    }
    .nav-pills .nav-link {
      color: #6c757d;
      font-weight: 600;
    }
    .nav-pills .nav-link.active {
      background-color: #0d6efd;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container p-3">
    <div class="card auth-card border-0 shadow-sm mx-auto p-4">
      
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle p-3 mb-2">
          <i class="bi bi-bank2 fs-3"></i>
        </div>
        <h4 class="fw-bold mb-1">CoreBank</h4>
        <p class="text-muted small mb-0">Bireysel İnternet Bankacılığı</p>
      </div>


      <ul class="nav nav-pills nav-fill mb-4 bg-light p-1 rounded-3" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active py-2" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">Giriş Yap</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link py-2" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">Kayıt Ol</button>
        </li>
      </ul>

      <div class="tab-content" id="authTabsContent">
        
        <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
          <form id="loginForm" action="index.html" method="get">
            <div class="mb-3">
              <label class="form-label small fw-semibold">T.C. Kimlik No / Müşteri No</label>
              <input type="text" class="form-control" id="loginIdentityNumber" placeholder="11 Haneli Kimlik Numaranız" inputmode="numeric" pattern="[0-9]{11}" oninput="this.value = this.value.replace(/[^0-9]/g, '')" maxlength="11" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Şifre</label>
              <input type="password" class="form-control" id="loginPassword" placeholder="6 Haneli Sayısal Şifreniz" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">Giriş Yap</button>
          </form>
        </div>

        <div class="tab-pane fade" id="register-pane" role="tabpanel">
          <form id="registerForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Ad Soyad</label>
              <input type="text" class="form-control" id="registerFullName" placeholder="Adınız Soyadınız" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">T.C. Kimlik No</label>
              <input type="text" class="form-control" id="registerIdentityNumber" placeholder="11 Haneli Kimlik Numaranız" inputmode="numeric" pattern="[0-9]{11}" oninput="this.value = this.value.replace(/[^0-9]/g, '')" maxlength="11" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">E-posta</label>
              <input type="email" class="form-control" id="registerEmail" placeholder="example@gmail.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Şifre Belirleyin</label>
              <input type="password" class="form-control" id="registerPassword" placeholder="6 Haneli Sayısal Şifreniz" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold mt-2">Hesap Oluştur</button>
          </form>
        </div>

      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    window.addEventListener('pageshow', function () {
      document.getElementById('loginForm').reset();
      document.getElementById('registerForm').reset();
    });

    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const registeredTc = document.getElementById('registerIdentityNumber').value;

      alert("Başarıyla kayıt olundu, giriş yapın.");

      document.getElementById('registerForm').reset();

      const loginTabTrigger = document.querySelector('#login-tab');
      const tab = new bootstrap.Tab(loginTabTrigger);
      tab.show();

      document.getElementById('loginIdentityNumber').value = registeredTc;
    });
  </script>
</body>
</html>
